<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* Wembley PS P&C Brand Identity Guide v1.1 */
    :root { --deep-navy:#1E3D7A; --navy:#2E5AAC; --cyan:#3CADD4; --near-black:#1A2744; --mid-grey:#5A6A8A;
            --pale-blue:#DDE6F5; --off-white:#F7F9FC; --panel-tint:#F1F6FC; --cyan-tint:#EAF6FB; --coral:#C2412E; }
    body { font-family: 'Lato', 'Helvetica Neue', Helvetica, sans-serif; font-size: 14px; color: var(--near-black); background: #fff; margin: 0; padding: 4px 8px 12px; }
    .kicker { font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--navy); }
    .rule { height: 4px; background: var(--cyan); border-radius: 2px; margin: 6px 0 4px; }
    label { display: block; font-family: 'Nunito', sans-serif; font-weight: 800; color: var(--deep-navy); margin: 14px 0 5px; }
    .hint { font-family: 'Lato', sans-serif; font-weight: 400; color: var(--mid-grey); font-size: 12.5px; }
    input, select, textarea { width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: 14px; color: var(--near-black);
      border: 1px solid var(--pale-blue); border-radius: 8px; font-family: inherit; background: #fff; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--cyan); outline-offset: 0; border-color: var(--cyan); }
    textarea { height: 64px; resize: vertical; }
    .row { display: flex; gap: 10px; } .row > div { flex: 1; }
    .check { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-family: 'Lato', sans-serif; font-weight: 400; color: var(--near-black); }
    .check input { width: auto; accent-color: var(--navy); }
    button { margin-top: 18px; padding: 10px 20px; font-size: 14px; border-radius: 8px; cursor: pointer; font-family: 'Nunito', sans-serif; font-weight: 700; }
    .primary { background: var(--navy); color: #fff; border: 2px solid var(--navy); }
    .primary:hover { background: var(--deep-navy); border-color: var(--deep-navy); }
    .primary:disabled { opacity: .55; cursor: default; }
    .secondary { background: #fff; color: var(--navy); border: 2px solid var(--pale-blue); margin-left: 6px; }
    #msg { margin-top: 14px; padding: 12px 14px; border-radius: 12px; display: none; white-space: pre-wrap; word-break: break-word; }
    #msg a { color: var(--navy); font-weight: 700; }
    .ok { background: var(--cyan-tint); border-left: 4px solid var(--navy); }
    .err { background: #fff; border: 1px solid var(--pale-blue); border-left: 4px solid var(--coral); color: var(--coral); }
  </style>
</head>
<body>
  <div class="kicker">P&amp;C volunteer roster</div>
  <div class="rule"></div>
  <label>Event name</label>
  <input id="name" placeholder="e.g. Election day sausage sizzle">

  <div class="row">
    <div><label>Type</label><select id="type"></select></div>
    <div><label>Date</label><input id="date" type="date"></div>
  </div>

  <label>Location</label>
  <input id="location" placeholder="e.g. School undercover area">

  <div class="row">
    <div><label>Coordinator</label><input id="coordinator" placeholder="Name"></div>
    <div><label>Coordinator email</label><input id="coordinatorEmail" type="email" placeholder="name@example.com"></div>
  </div>

  <label>Start from <span class="hint">– copies the slots, shifted to the new date</span></label>
  <select id="source">
    <option value="">Blank – I'll add slots myself</option>
    <optgroup label="Templates" id="tpls"></optgroup>
    <optgroup label="Copy a previous event" id="evs"></optgroup>
  </select>

  <label>Extra questions <span class="hint">(optional) one per line. *Required. Choices in [Yes|No]</span></label>
  <textarea id="extra" placeholder="Can you bring a plate to share? [Yes|No]&#10;*Do you have a current food handling certificate? [Yes|No]"></textarea>
  <div class="hint">Leave blank to use the template's or previous event's questions.</div>

  <label class="check"><input type="checkbox" id="createForm" checked> Create the sign-up form straight away</label>
  <div class="hint">Untick if you want to tweak slots on the Slots tab first (then use “Create / update sign-up form”).</div>

  <button class="primary" id="go" onclick="go()">Create event</button>
  <button class="secondary" onclick="google.script.host.close()">Close</button>
  <div id="msg"></div>

  <script>
    google.script.run.withSuccessHandler(function (d) {
      var t = document.getElementById('type');
      d.types.forEach(function (x) { t.add(new Option(x, x)); });
      var tp = document.getElementById('tpls');
      d.templates.forEach(function (x) { tp.appendChild(new Option(x, 'T:' + x)); });
      var ev = document.getElementById('evs');
      d.events.forEach(function (x) { ev.appendChild(new Option(x.label, 'E:' + x.id)); });
      document.getElementById('coordinatorEmail').value = d.adminEmail || '';
    }).getDialogData();

    function v(id) { return document.getElementById(id).value; }

    function show(text, ok) {
      var m = document.getElementById('msg');
      m.className = ok ? 'ok' : 'err';
      m.style.display = 'block';
      m.innerHTML = '';
      m.appendChild(document.createTextNode(text));
      return m;
    }

    function go() {
      var data = {
        name: v('name'), type: v('type'), date: v('date'), location: v('location'),
        coordinator: v('coordinator'), coordinatorEmail: v('coordinatorEmail'),
        source: v('source'), extraQuestions: v('extra'),
        createForm: document.getElementById('createForm').checked
      };
      if (!data.name || !data.date) { show('Please enter an event name and date.', false); return; }
      var b = document.getElementById('go');
      b.disabled = true; b.textContent = 'Creating…';
      google.script.run
        .withSuccessHandler(function (r) {
          b.textContent = 'Done';
          var text = r.id + ' created with ' + r.slots + ' slot(s).\n\n' +
            (r.url ? 'Sign-up form link (share this with families):\n' :
              'Next: add or edit slots on the Slots tab (now showing just this event), then use P&C Roster › Create / update sign-up form.');
          var m = show(text, true);
          if (r.url) {
            var a = document.createElement('a'); a.href = r.url; a.target = '_blank'; a.textContent = r.url;
            m.appendChild(a);
          }
        })
        .withFailureHandler(function (e) { b.disabled = false; b.textContent = 'Create event'; show(e.message, false); })
        .createEventFromDialog(data);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Wembley PS P&C Brand Identity Guide v1.1 */
  :root { --deep-navy:#1E3D7A; --navy:#2E5AAC; --cyan:#3CADD4; --near-black:#1A2744; --mid-grey:#5A6A8A;
          --pale-blue:#DDE6F5; --off-white:#F7F9FC; --panel:#F1F6FC; --cyan-tint:#EAF6FB; --coral:#C2412E; --sage:#3F7A5A; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--off-white); color: var(--near-black); font-family: 'Lato', 'Helvetica Neue', Helvetica, sans-serif; font-size: 16px; line-height: 1.5; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
  header { padding: 4px 0 12px; border-bottom: 3px solid var(--cyan); margin-bottom: 18px; }
  header img { height: 52px; width: auto; display: block; }
  header .pc { font-family: 'Nunito', sans-serif; font-weight: 800; color: var(--navy); font-size: 18px; }
  h1 { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 26px; line-height: 1.2; color: var(--deep-navy); margin: 0 0 6px; }
  h3 { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 17px; color: var(--deep-navy); margin: 0; }
  p { margin: 0 0 12px; }
  .muted { color: var(--mid-grey); } .small { font-size: 14px; }
  a { color: var(--navy); font-weight: 700; }
  .card { background: #fff; border: 1px solid var(--pale-blue); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  button { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; border-radius: 10px; padding: 9px 14px; border: 2px solid var(--pale-blue); background: #fff; color: var(--navy); cursor: pointer; white-space: nowrap; }
  button.yes { background: var(--coral); border-color: var(--coral); color: #fff; }
  .pill { display: inline-block; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 12px; border-radius: 999px; padding: 2px 10px; white-space: nowrap; background: var(--pale-blue); color: var(--deep-navy); }
  .pill.ok { background: #E7F1EB; color: var(--sage); }
  .panel { background: var(--panel); border-radius: 16px; padding: 14px 16px; margin-top: 16px; }
  .note { background: var(--cyan-tint); border-left: 4px solid var(--navy); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header><span id="logo"><span class="pc">Wembley PS P&amp;C</span></span></header>
  <div id="app"><p class="muted">Loading…</p></div>
</div>
<script>
const BOOT = <?!= boot ?>;
let D = null, confirming = null, note = '';
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function call(fn, ...args) { return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](BOOT.token, ...args)); }
function fail(e) { document.getElementById('app').innerHTML = `<h1>Sorry</h1><p>${esc((e && e.message) || 'Something went wrong.')}</p><p>You can also just reply to your confirmation email.</p>`; }

function render() {
  if (D.logo) document.getElementById('logo').innerHTML = `<img src="${D.logo}" alt="${esc(D.pcName)}">`;
  const rows = D.slots.map(s => {
    let right;
    if (s.status === 'Cancelled') right = '<span class="pill">Cancelled</span>';
    else if (s.past) right = '<span class="pill ok">Thank you</span>';
    else if (!s.canCancel) right = '';
    else if (confirming === s.ref) right = `<span><button class="yes" onclick="cancel('${s.ref}')">Yes, cancel</button> <button onclick="confirming=null;render()">Keep</button></span>`;
    else right = `<button onclick="confirming='${s.ref}';render()">Can't make it</button>`;
    return `<div class="card"><div><h3>${esc(s.role)}</h3><div class="small muted">${esc(s.dateText)}${s.timeText ? ' · ' + esc(s.timeText) : ''}${s.status === 'Waitlist' ? ' · on the waitlist' : ''}</div></div>${right}</div>`;
  }).join('');
  const active = D.slots.filter(s => s.canCancel).length;
  document.getElementById('app').innerHTML = `
    ${note ? `<div class="note">${note}</div>` : ''}
    <h1>${esc(D.eventName)}</h1>
    <p>Hi ${esc(D.name)}, ${active ? 'here are your volunteer spots.' : 'here\'s what you signed up for.'}${D.location ? ' <span class="muted">' + esc(D.location) + '</span>' : ''}</p>
    ${rows}
    <div class="panel small">
      ${D.formUrl ? `Want a different time? Cancel here, then <a href="${esc(D.formUrl)}" target="_blank">pick another slot</a>.<br>` : ''}
      Questions? ${D.coordinator ? esc(D.coordinator) + ' – ' : ''}<a href="mailto:${esc(D.coordinatorEmail)}">${esc(D.coordinatorEmail)}</a>
    </div>`;
}
function cancel(ref) {
  document.getElementById('app').style.opacity = 0.5;
  call('vmCancel', ref).then(d => {
    D = d; confirming = null; note = 'Done – thanks for letting us know. Your spot is free for someone else.';
    document.getElementById('app').style.opacity = 1; render(); window.scrollTo(0, 0);
  }).catch(fail);
}
call('vmLoad').then(d => { D = d; render(); }).catch(fail);
</script>
</body>
</html>
